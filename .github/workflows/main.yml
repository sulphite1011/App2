name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          mkdir -p app/src/main/java/com/abnormal/calendar app/src/main/res/layout gradle/wrapper
          wget -q https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          wget -q https://github.com/gradle/gradle/raw/v8.2.0/gradlew -O gradlew
          chmod +x gradlew
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'AbnormalCalendar'" >> settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.20' apply false }" > build.gradle
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbnormalCalendar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
